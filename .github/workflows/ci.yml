# Автотесты при каждом изменении: модульные + интеграционные с PostgreSQL.
# Версию (тег vX.Y.Z) ставят только на коммит в main, у которого эта проверка прошла.
name: Тесты

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gm
          POSTGRES_PASSWORD: gm
          POSTGRES_DB: gasmeter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gm -d gasmeter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://gm:gm@localhost:5432/gasmeter_test
      - name: Проверка сборки Docker-образа
        run: docker build -t gasmeter-shop:ci .
