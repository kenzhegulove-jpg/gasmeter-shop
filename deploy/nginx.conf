# Пример конфигурации nginx (HTTPS обязателен: камера смартфона работает только по HTTPS)
server {
    listen 80;
    server_name meters.example.kz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name meters.example.kz;

    ssl_certificate     /etc/ssl/meters/fullchain.pem;
    ssl_certificate_key /etc/ssl/meters/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 200m;   # загрузка папки с реестрами ТУ

    # Кабинет сотрудников можно ограничить корпоративной сетью:
    # location ~ ^/(staff|api/(auth|seller|admin)) { allow 10.0.0.0/8; deny all; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
